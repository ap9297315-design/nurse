<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded edges -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#5eead4" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="172" fill="#134e4a" opacity="0.6" filter="url(#shadow)" />

  <!-- Medical Red/White Cross Emblem -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="226" y="146" width="60" height="220" rx="20" fill="url(#crossGrad)" />
    <!-- Horizontal bar -->
    <rect x="146" y="226" width="220" height="60" rx="20" fill="url(#crossGrad)" />
  </g>

  <!-- Golden Nurse Lamp / Stethoscope Caduceus Center Spark -->
  <circle cx="256" cy="256" r="24" fill="#0d9488" />
  <path d="M256 240 L260 252 L272 256 L260 260 L256 272 L252 260 L240 256 L252 252 Z" fill="#facc15" />
  
  <!-- Pulse Wave Line underneath -->
  <path d="M166 330 L206 330 L220 310 L236 350 L256 295 L276 345 L292 320 L306 330 L346 330" 
        fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
